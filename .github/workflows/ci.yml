name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The site tests (tests/accounts.rs and the others) make a database per test here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: buwiz_cloud
          POSTGRES_PASSWORD: buwiz_cloud
          POSTGRES_DB: buwiz_cloud
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://buwiz_cloud:buwiz_cloud@localhost:5432/buwiz_cloud
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Without the `bir` feature: the public build, which has no BIR relay
      # files. Production builds use `--features bir` (see the Dockerfile).
      # rustfmt per file: `cargo fmt` stops on the private targets that
      # Cargo.toml declares but this repository does not have.
      - run: git ls-files -z -- '*.rs' ':!:bot-site/' ':!:e2e/' | xargs -0 rustfmt --check --edition 2024
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The Buwiz Bot site (bot-site/), a crate of its own built for wasm. Its
  # dist/ is committed (bot-site/build.sh) and checked by the server's tests.
  bot-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-site
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bot-site
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
