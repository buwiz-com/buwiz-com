[package]
name = "buwiz-cloud"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Buwiz accounts, TIN activation and sign-in for the Buwiz apps"
license = "UNLICENSED"
publish = false

[[bin]]
name = "buwiz-cloud"
path = "src/main.rs"

[[bin]]
name = "buwiz-relay"
path = "src/bin/buwiz-relay.rs"
required-features = ["bir"]

[[bin]]
name = "buwiz-trust-sign"
path = "src/bin/buwiz-trust-sign.rs"

[[bin]]
name = "buwiz-sender"
path = "src/bin/buwiz-sender.rs"

# Tests and examples that need the BIR relay code. Their paths are given so
# that a checkout without those files still parses.
[[test]]
name = "relay"
path = "tests/relay.rs"
required-features = ["bir"]

[[test]]
name = "iaf_golden"
path = "tests/iaf_golden.rs"
required-features = ["bir"]

# Needs the OCR engine and its models (`scripts/ocr-models.sh`).
[[test]]
name = "ocr"
path = "tests/ocr.rs"
required-features = ["ocr"]

[[example]]
name = "iaf-decrypt"
path = "examples/iaf-decrypt.rs"
required-features = ["bir"]

[features]
default = []
# The BIR relay: `src/bir/` (dispatcher, IAF encryption, SFTP upload) and
# the v1 reference client. Without it the Sender answers every send with
# `failed`, "relay not built in". Production builds use `--features bir`.
bir = [
    "dep:aes",
    "dep:cbc",
    "dep:flate2",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:pbkdf2",
    "dep:russh",
    "dep:russh-sftp",
    "dep:sha1",
]
# Reads the TIN ID and Form 2303 of a claim on this server: PaddleOCR
# PP-OCRv5 mobile on ONNX Runtime (`oar-ocr`), and the text layer of digital
# PDFs. Without it every reading ends "OCR not built in". The models are
# files under `OCR_MODEL_DIR` (`scripts/ocr-models.sh` fetches them).
ocr = ["dep:image", "dep:oar-ocr", "dep:pdf-extract"]

[dependencies]
aes = { version = "0.8", optional = true }
aes-gcm = "0.10"
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"], optional = true }
ed25519-dalek = "2"
flate2 = { version = "1", default-features = false, features = ["zlib"], optional = true }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
http = "1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
oar-ocr = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"], optional = true }
pdf-extract = { version = "0.12", optional = true }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63", default-features = false, features = ["flate2", "ring"], optional = true }
russh-sftp = { version = "3", optional = true }
# The Bot site (`bot-site/dist/`), embedded in debug builds too.
rust-embed = { version = "8", features = ["debug-embed"] }
rusty-s3 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha1 = { version = "0.10", optional = true }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time", "migrate", "macros", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
topcoat = { version = "0.11", default-features = false, features = ["router", "view"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
zeroize = "1"

[profile.release]
lto = "thin"

[dev-dependencies]
font8x8 = "0.3"
tower = { version = "0.5", features = ["util"] }
