[package]
name = "buwiz-cloud"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Buwiz accounts, TIN activation and sign-in for the Buwiz apps"
license = "UNLICENSED"
publish = false

[[bin]]
name = "buwiz-cloud"
path = "src/main.rs"

[[bin]]
name = "buwiz-relay"
path = "src/bin/buwiz-relay.rs"

[[bin]]
name = "buwiz-sender"
path = "src/bin/buwiz-sender.rs"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
ed25519-dalek = "2"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63", default-features = false, features = ["flate2", "ring"] }
russh-sftp = "3"
rusty-s3 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
topcoat = { version = "0.11", default-features = false, features = ["router", "view"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webpki-roots = "1"
zeroize = "1"

[profile.release]
lto = "thin"
