# End-to-end tests of submission v2 with the real Buwiz Forms client
# (`bir-submit` and `bir-core` from hexuria/buwiz-forms, pinned by rev). A
# workspace of its own, so the server's CI never builds it: it uses the
# server's BIR relay, so it builds the server with the `bir` feature and
# needs those files. Run it with `scripts/v6.sh`.
[package]
name = "buwiz-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
bir-core = { git = "https://github.com/hexuria/buwiz-forms", rev = "be1051a62b5997eef93600829488ac57b4e427b4" }
bir-submit = { git = "https://github.com/hexuria/buwiz-forms", rev = "be1051a62b5997eef93600829488ac57b4e427b4" }
buwiz-cloud = { path = "..", features = ["bir"] }
chrono = "0.4"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = { version = "0.65.1", default-features = false, features = ["flate2", "ring"] }
russh-sftp = "3"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate"] }
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
