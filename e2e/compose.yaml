# Throwaway Postgres for scripts/v6.sh. Data lives in tmpfs and goes away
# with the container.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buwiz_e2e
      POSTGRES_PASSWORD: buwiz_e2e
      POSTGRES_DB: buwiz_e2e
    ports:
      - "127.0.0.1:${V6_PG_PORT:-54339}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buwiz_e2e -d buwiz_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
