# Fly.io: one container, Postgres attached through DATABASE_URL.
# Secrets (fly secrets): DATABASE_URL, DOCUMENT_KEY, RECEIPT_SIGNING_KEY,
# RESEND_API_KEY, MAIL_FROM, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY.
# See docs/deploy.md.
app = "buwiz-cloud"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  RUST_LOG = "info"
  MAIL_TRANSPORT = "resend"
  # Device sign-in links point at ACCOUNT_ORIGIN. The mini app calls
  # api.buwiz.com; both names and fly.dev serve the same app.
  ACCOUNT_ORIGIN = "https://account.buwiz.com"
  EXTRA_ORIGINS = "https://api.buwiz.com,https://buwiz-cloud.fly.dev"
  ADMIN_EMAILS = "support@buwiz.com"
  # Claim documents in Cloudflare R2 (keys are secrets).
  S3_ENDPOINT = "https://f1d5007ee46f17d2bd7a1d6cb4402906.r2.cloudflarestorage.com"
  S3_REGION = "auto"
  S3_BUCKET = "buwiz"
  BIR_RELAY_MODE = "dry_run"

[http_service]
  internal_port = 8080
  force_https = true
  # Device sign-in polls every few seconds; keep one machine warm.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
